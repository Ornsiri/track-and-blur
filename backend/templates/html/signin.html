<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.84.0">

    <link rel="canonical" href="https://getbootstrap.com/docs/5.0/examples/jumbotron/">

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <!-- font awesome  -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
        integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous" />

    <!-- JS file
    <script type="text/javascript" src="../js/app.js"></script> -->

    <!-- Header CSS
    <link href="../css/headers.css" rel="stylesheet"> -->

</head>

<body>
    <main class="container" style="height: 92vh;">
        <div class="py-4" style="height: 100%;">
            <div class="p-5 bg-light rounded-3  d-flex align-items-center" style="height: 100%;">
                <div class="container-fluid py-5 col-md-8 bg-white rounded-3 align-middle d-flex justify-content-center">
        
                    <form action="{{ url_for('signin') }}" method="POST" autocomplete="off" class="p-3 w-100 justify-content-center needs-validation" novalidate>
                        <div class="text-center mb-5">
                            <img src="../../static/assets/images/logo.png" alt="">
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">Username</span>
                            <input type="username" name="username" id="username-signin" value="" class="form-control" placeholder="Username" aria-label="Username" aria-describedby="username" required>
                            <div class="invalid-feedback">
                                Please provide your username.
                            </div>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text">Password</span>
                            <input type="password" name="password" id="password-signin" value="" class="form-control" placeholder="Password" aria-label="Password" aria-describedby="password" required>
                            <span class="input-group-text" onclick="showAndHidePassword();">
                                <i class="fas fa-eye" id="show_eye"></i>
                                <i class="fas fa-eye-slash d-none" id="hide_eye"></i>
                            </span>
                            <div class="invalid-feedback">
                                Please provide your password.
                            </div>
                        </div>
                        
                        <div class="text-center mt-5">
                            <a href="{{ url_for('upload') }}">
                                <button type="submit" class="btn btn-primary w-50">Sign in</button>
                            </a>
                        </div>
        
                    </form>
        
                </div>
            </div>
        </div>
    </main>
    <footer class="ps-5 mb-3 pt-2 text-muted border-top">
        &copy; Blur and Track, Thammasat University 2023
    </footer>

    <script>
        'use strict'
        // Show/Hide password 
        function showAndHidePassword() {
            var x = document.getElementById("password-signin");
            var show_eye = document.getElementById("show_eye");
            var hide_eye = document.getElementById("hide_eye");
            hide_eye.classList.remove("d-none");
            if (x.type === "password") {
                x.type = "text";
                show_eye.style.display = "none";
                hide_eye.style.display = "block";
            } else {
                x.type = "password";
                show_eye.style.display = "block";
                hide_eye.style.display = "none";
            }
        }

        // Form validation
        (() => {

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>

</body>

</html>
